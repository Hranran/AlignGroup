name: Source and configuration checks
on:
  push:
  pull_request:
jobs:
  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - run: python tools/check_release.py
      - run: bash -n scripts/main_new.sh && bash -n install.sh
